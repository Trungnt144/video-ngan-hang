<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Thử SVG + GSAP + CSS</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1230; overflow: hidden; font-family: "Be Vietnam Pro", sans-serif; }
  svg { display: block; width: 100vw; height: 100vh; }
  /* hoạt ảnh CSS: vòng đứt nét quay vô hạn và điểm sáng nhấp nháy */
  .vong { transform-origin: 960px 540px; animation: quay 6s linear infinite; }
  .nhap { animation: nhap 1.5s ease-in-out infinite alternate; }
  @keyframes quay { to { transform: rotate(360deg); } }
  @keyframes nhap { from { opacity: .15; } to { opacity: 1; } }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1230"/><stop offset="1" stop-color="#1b2a5e"/>
    </linearGradient>
    <linearGradient id="cot" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#06d6a0"/><stop offset="1" stop-color="#ffd166"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#nen)"/>

  <g class="vong">
    <circle cx="960" cy="540" r="430" fill="none" stroke="#3a5bd9" stroke-width="6" stroke-dasharray="40 26" opacity=".7"/>
    <circle cx="960" cy="110" r="14" fill="#ffd166"/>
  </g>
  <circle class="nhap" cx="1780" cy="130" r="22" fill="#ef476f"/>

  <text id="tieude" x="960" y="210" text-anchor="middle" font-size="84" font-weight="700" fill="#fff" opacity="0">Truyền tải điện: giảm tổn thất đường dây</text>

  <!-- 5 cột -->
  <g id="cots" transform="translate(560 880)">
    <rect class="cot" x="0"   y="-300" width="120" height="300" fill="url(#cot)" rx="10"/>
    <rect class="cot" x="170" y="-300" width="120" height="300" fill="url(#cot)" rx="10"/>
    <rect class="cot" x="340" y="-300" width="120" height="300" fill="url(#cot)" rx="10"/>
    <rect class="cot" x="510" y="-300" width="120" height="300" fill="url(#cot)" rx="10"/>
    <rect class="cot" x="680" y="-300" width="120" height="300" fill="url(#cot)" rx="10"/>
  </g>

  <!-- hạt di chuyển theo đường cong -->
  <path id="duong" d="M 200 600 C 600 300, 1300 900, 1720 560" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="4"/>
  <circle id="hat1" r="22" fill="#4cc9f0"/>
  <circle id="hat2" r="16" fill="#f72585"/>
  <circle id="hat3" r="12" fill="#b5179e"/>

  <text id="dem" x="960" y="470" text-anchor="middle" font-size="150" font-weight="800" fill="#ffffff">0 V</text>
  <text id="xung" x="60" y="1030" font-size="32" fill="#9fb3d9">Xung nhịp: 0</text>
  <text id="tg" x="1860" y="1030" text-anchor="end" font-size="32" fill="#9fb3d9">t = 0.000 s</text>
</svg>

<script>
// Trang thử 2: SVG + GSAP 3.12.5 + CSS animation + setInterval, dài 10 giây.
const TONG = 10;
const tl = gsap.timeline({ defaults: { ease: 'power2.inOut' } });
gsap.set('#tieude', { y: 40 });
tl.to('#tieude', { opacity: 1, y: 0, duration: 1.2, ease: 'power3.out' }, 0.3);
document.querySelectorAll('.cot').forEach((el, i) => {
  tl.fromTo(el, { scaleY: 0, transformOrigin: '50% 100%' },
    { scaleY: 0.35 + (i % 3) * 0.3, duration: 2.5, ease: 'elastic.out(1,0.5)' }, 1 + i * 0.35);
  tl.to(el, { scaleY: 1 - i * 0.12, duration: 3, ease: 'power1.inOut' }, 5 + i * 0.25);
});
const duong = document.querySelector('#duong');
const L = duong.getTotalLength();
const dich = { p: 0 };
tl.to(dich, { p: 1, duration: 8, ease: 'none', onUpdate() {
  [['#hat1', 0], ['#hat2', 0.06], ['#hat3', 0.12]].forEach(([id, off]) => {
    const k = Math.max(0, Math.min(1, dich.p - off));
    const pt = duong.getPointAtLength(k * L);
    gsap.set(id, { attr: { cx: pt.x, cy: pt.y } });
  });
} }, 1);
const v = { u: 0 };
tl.to(v, { u: 220, duration: 7, ease: 'power2.out', onUpdate() {
  document.getElementById('dem').textContent = Math.round(v.u) + ' V';
} }, 1.5);
// kết: mờ dần ở giây 9,2–10 (còn 25% độ sáng, không tắt hẳn)
tl.to('svg', { opacity: 0.25, duration: 0.8, ease: 'none' }, 9.2);
tl.set({}, {}, TONG); // khoá độ dài timeline đúng 10 giây

let n = 0;
setInterval(() => { document.getElementById('xung').textContent = 'Xung nhịp: ' + (++n); }, 100);
gsap.ticker.add(() => { document.getElementById('tg').textContent = 't = ' + (gsap.ticker.time).toFixed(3) + ' s'; });
</script>
</body>
</html>
